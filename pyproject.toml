[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diablo-events"
version = "0.1.0"
description = "CLI-first Helltides event reader"
requires-python = ">=3.11"

[project.scripts]
diablo-events = "diablo_events.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
